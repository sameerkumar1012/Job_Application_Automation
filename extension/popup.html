<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Job Apply Copilot</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>Job Apply Copilot</h1>
    <a id="open-dashboard" href="#">Open profile editor &rarr;</a>
  </header>

  <div id="server-warning" class="banner banner-warn hidden">
    Local server not reachable at 127.0.0.1:8765. Run <code>python run.py</code> first.
  </div>

  <button id="fill-button" class="primary">Fill this page</button>

  <label class="checkbox-row">
    <input type="checkbox" id="auto-advance-toggle">
    Auto-advance through wizard steps
  </label>

  <div id="blocked-banner" class="banner banner-warn hidden"></div>

  <section id="results">
    <div id="filled-section">
      <h2>Filled fields</h2>
      <ul id="filled-list"></ul>
    </div>
    <div id="attached-section">
      <h2>Attached files</h2>
      <ul id="attached-list"></ul>
    </div>
    <div id="unfilled-section">
      <h2>Needs your attention</h2>
      <ul id="unfilled-list"></ul>
    </div>
  </section>

  <p class="reminder">This extension never submits an application. Always review before you click submit.</p>

  <script src="popup.js"></script>
</body>
</html>
